---
# =============================================================================
# Security Scanning Pipeline
# =============================================================================
# Scans code, configs, and dependencies for known vulnerabilities.
#
# Runs on PRs to main and weekly on a schedule to catch new CVEs.
# =============================================================================
name: Security

"on":
  pull_request:
    branches: [main, develop]
  schedule:
    # Every Monday at 06:00 UTC — catches new CVEs in between PRs
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

# Prevent overlapping scheduled + manual runs from wasting resources
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Trivy — vulnerability scanning for code, configs, and dependencies
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Direct install avoids trivy-action bootstrap failures on GitHub runners.
      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | \
            sh -s -- -b /usr/local/bin v0.69.2

      - name: Run Trivy filesystem scan
        run: |
          set -euo pipefail
          trivy fs --severity HIGH,CRITICAL --exit-code 1 .
